name: Build VCut2DAW Standalone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --collect-all aaf2 --collect-all scenedetect --collect-all customtkinter --icon=icon.ico --add-data "icon.ico;." --version-file=file_version_info.txt --name VCut2DAW app.py

    - name: Build macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconsole --windowed --collect-all aaf2 --collect-all scenedetect --collect-all customtkinter --icon=icon.icns --add-data "icon.icns:." --osx-bundle-identifier com.vcut2daw.app --name VCut2DAW app.py

    - name: Install create-dmg (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install create-dmg

    - name: Create macOS DMG
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        create-dmg \
          --volname "VCut2DAW Installer" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "VCut2DAW.app" 200 190 \
          --hide-extension "VCut2DAW.app" \
          --app-drop-link 600 185 \
          "VCut2DAW.dmg" \
          "VCut2DAW.app"

    - name: Archive Production Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VCut2DAW-Windows
        path: dist/VCut2DAW.exe

    - name: Archive Production Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VCut2DAW-macOS
        path: dist/VCut2DAW.dmg
