name: Build VCut2ProTools Standalone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Executable
      run: |
        pyinstaller --noconsole --onefile --hidden-import aaf2 --collect-all scenedetect --name VCut2ProTools app.py

    - name: Archive Production Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VCut2ProTools-Windows
        path: dist/VCut2ProTools.exe

    - name: Archive Production Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VCut2ProTools-macOS
        path: dist/VCut2ProTools.app
