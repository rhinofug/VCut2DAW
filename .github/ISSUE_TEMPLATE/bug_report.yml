name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Windows 11, macOS 14.5
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: protools
    attributes:
      label: DAW Version
      description: e.g., Pro Tools 2024.3, Nuendo 13, Reaper 7
      placeholder: Reaper 7.11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Console Output
      description: Please copy and paste the console output from the VCut2DAW app, or the DAW error message.
      render: shell
    validations:
      required: false
